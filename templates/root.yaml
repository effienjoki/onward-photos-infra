AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics delivery photos. Root stack for the primary Region (Ireland).
  Each layer is a child stack whose template is uploaded to S3 by GitHub Actions.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  TemplatesRevision:
    Type: String
    Default: initial
    Description: Commit ID of the child templates in S3. Updated by GitHub Actions; changing it triggers Git sync.
  DbInstanceClass: db.t4g.micro
  MultiAz: 'true'
  BackupRetentionDays: 7
  DeletionProtection: 'true'
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  AppPort:
    Type: Number
    Default: 8080
  DbPort:
    Type: Number
    Default: 5432
  NoncurrentVersionDays:
    Type: Number
    Default: 90
  ReplicaRegion:
    Type: String
    Default: eu-central-1
  ReplicaStorageClass:
    Type: String
    Default: GLACIER_IR
    AllowedValues: [STANDARD, STANDARD_IA, GLACIER_IR]

Resources:

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://onward-${Environment}-cfn-templates-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/children/network.yaml'
      Parameters:
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        AppPort: !Ref AppPort
        DbPort: !Ref DbPort

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://onward-${Environment}-cfn-templates-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/children/storage.yaml'
      Parameters:
        Environment: !Ref Environment
        NoncurrentVersionDays: !Ref NoncurrentVersionDays
        ReplicaRegion: !Ref ReplicaRegion
        ReplicaStorageClass: !Ref ReplicaStorageClass

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://onward-${Environment}-cfn-templates-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com/children/database.yaml'
      Parameters:
        Environment: !Ref Environment
        DataSubnetIds: !GetAtt NetworkStack.Outputs.DataSubnetIds
        DbSecurityGroupId: !GetAtt NetworkStack.Outputs.DbSecurityGroupId
        DbPort: !Ref DbPort
        DbInstanceClass: !Ref DbInstanceClass
        MultiAz: !Ref MultiAz
        BackupRetentionDays: !Ref BackupRetentionDays
        DeletionProtection: !Ref DeletionProtection

Outputs:
  TemplatesRevision:
    Description: Which commit's child templates are deployed.
    Value: !Ref TemplatesRevision
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  AppSubnetIds:
    Value: !GetAtt NetworkStack.Outputs.AppSubnetIds
  PhotoBucketName:
    Value: !GetAtt StorageStack.Outputs.PhotoBucketName
  DbEndpoint:
    Value: !GetAtt DatabaseStack.Outputs.DbEndpoint