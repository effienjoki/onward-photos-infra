AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics delivery photos. Replica bucket in the secondary Region
  (Frankfurt) that receives a copy of every photo from the primary bucket.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name, used in resource names.
  NoncurrentVersionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days to keep old versions of a photo before they are permanently removed.

Resources:
  ReplicaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'onward-${Environment}-photos-replica-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ReplicaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReplicaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ReplicaBucket.Arn
              - !Sub '${ReplicaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  ReplicaBucketName:
    Description: Name of the replica bucket.
    Value: !Ref ReplicaBucket
  ReplicaBucketArn:
    Description: ARN of the replica bucket, used by the replication rule in the primary Region.
    Value: !GetAtt ReplicaBucket.Arn